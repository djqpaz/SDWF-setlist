<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDWF Prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:  oklch(0.78 0.15 75);
      --green: oklch(0.72 0.16 150);
      --dim:   oklch(0.66 0.01 90);
      --mid:   oklch(0.75 0.01 90);
      --dark:  oklch(0.4  0.01 90);
      --faint: oklch(0.35 0.01 90);
      --font:  'JetBrains Mono', 'Courier New', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff; font-family: var(--font); overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── shared chrome ──────────────────────────────────────────────────── */
    .hd {
      background: var(--gold); color: #000;
      padding: 22px 32px;
      display: flex; justify-content: space-between; align-items: center;
      font: 700 44px/1 var(--font);
      flex-shrink: 0;
    }
    .hd-r { font-size: 28px; white-space: nowrap; margin-left: 24px; }
    .ft {
      border-top: 3px solid var(--dark);
      display: flex; font: 700 30px/1 var(--font); color: var(--mid);
      flex-shrink: 0;
    }
    .ft-cell { flex: 1; padding: 22px 0; text-align: center; cursor: default; }
    .ft-cell.hi { color: var(--gold); }
    .ft-cell + .ft-cell { border-left: 3px solid var(--dark); }

    /* ── menus / lists ──────────────────────────────────────────────────── */
    .scroll { flex: 1; overflow-y: auto; padding: 0; }
    .row {
      padding: 18px 32px;
      font-size: 46px; line-height: 1.1;
      display: flex; gap: 24px; align-items: baseline;
    }
    .row .n { min-width: 72px; flex-shrink: 0; }
    .row .lbl { flex: 1; }
    .row .r { color: var(--dim); font-size: 32px; flex-shrink: 0; }
    .row.dim { color: oklch(0.82 0.01 90); }
    .row.sel { background: var(--gold); color: #000; }
    .row.sel .r { color: #444; }
    .hint { padding: 12px 32px; font: 400 28px/1.4 var(--font); color: var(--dim); }

    /* ── live meta strip ─────────────────────────────────────────────────── */
    .meta-strip {
      display: flex; gap: 36px; padding: 16px 28px;
      border-bottom: 3px solid var(--gold);
      font: 700 30px/1 var(--font);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .meta-strip span { color: var(--dim); }
    .meta-strip span b { color: var(--gold); }

    /* ── live content ────────────────────────────────────────────────────── */
    .live-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 28px; }
    .section-banner {
      background: var(--green); color: #000;
      padding: 8px 14px; margin: 14px 0 12px;
      font: 700 28px/1.3 var(--font); letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .lines { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .line {
      display: flex; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px;
    }
    .token { display: flex; flex-direction: column; padding-right: 10px; max-width: 100%; }
    .token .ch {
      font: 700 26px/1.4 var(--font);
      background: var(--gold); color: #000;
      padding: 2px 7px; align-self: flex-start; white-space: nowrap;
    }
    .token .spc { display: block; height: 38px; }
    .token .wd { font: 400 var(--lyric, 34px)/1.3 var(--font); overflow-wrap: break-word; word-break: break-word; }

    /* ── next section preview ────────────────────────────────────────────── */
    .next-preview { padding-bottom: 16px; opacity: 0.42; flex-shrink: 0; max-height: 160px; overflow: hidden; }
    .next-banner {
      background: #fff; color: #000;
      padding: 8px 16px; margin-bottom: 14px;
      font: 700 30px/1 var(--font); letter-spacing: 0.08em;
    }
    .next-line {
      display: flex; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px;
    }
    .next-token { display: flex; flex-direction: column; padding-right: 12px; }
    .next-token .wd { font: 400 32px/1.3 var(--font); }

    /* ── sync / info screens ─────────────────────────────────────────────── */
    .info-block {
      margin: 28px 32px;
      border: 3px solid var(--faint);
      padding: 24px;
      display: flex; flex-direction: column; gap: 14px;
      font: 400 30px/1.5 var(--font);
    }
    .info-block b { color: var(--gold); }
    .info-block .green { color: var(--green); }
    .info-block .red   { color: oklch(0.7 0.16 25); }
    .btn {
      margin: 0 32px;
      padding: 26px; text-align: center;
      font: 700 34px/1 var(--font);
      cursor: pointer;
    }
    .btn.primary { background: var(--green); color: #000; }
    .btn.outline { border: 3px solid var(--dark); color: oklch(0.9 0.01 90); }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const PROJECT = "sdwf-setlist";
const API_KEY = "AIzaSyB4ZCM-WGSgGTZra0tuQ6WbZyMUfbt6BNU";
const FS = "https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents";
const VER = "v1.0";
const LONG_MS = 700; // long-press threshold

// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  screen: "menu",   // menu | shows | setlist | live | options | sync | foot
  menuSel: 0, showSel: 0, songSel: 0, secSel: 0,
  shows: [], songs: {}, show: null, setlist: [],
  sections: [],     // parsed sections for current song [{label, lines}]
  syncing: false, syncMsg: "", lastSync: null,
};
const MENU = ["Shows","Live View","Song Options","Storage | Sync","Foot Switch"];

// ── Firestore ─────────────────────────────────────────────────────────────────
async function fsAll(col) {
  const docs = []; let tok = null;
  do {
    const r = await fetch(FS+"/"+col+"?key="+API_KEY+"&pageSize=300"+(tok?"&pageToken="+tok:""));
    if (!r.ok) throw new Error("FS "+col+": "+r.status);
    const d = await r.json();
    if (d.documents) docs.push(...d.documents);
    tok = d.nextPageToken || null;
  } while (tok);
  return docs;
}
function parse(doc) {
  const id = doc.name.split("/").pop(), f = doc.fields||{}, o = {id};
  for (const [k,v] of Object.entries(f)) {
    if      (v.stringValue!==undefined)  o[k]=v.stringValue;
    else if (v.integerValue!==undefined) o[k]=Number(v.integerValue);
    else if (v.doubleValue!==undefined)  o[k]=Number(v.doubleValue);
    else if (v.booleanValue!==undefined) o[k]=v.booleanValue;
    else if (v.nullValue!==undefined)    o[k]=null;
    else if (v.arrayValue) o[k]=(v.arrayValue.values||[]).map(x=>
      x.stringValue!==undefined?x.stringValue:x.integerValue!==undefined?Number(x.integerValue):null);
  }
  return o;
}

// ── Cache ─────────────────────────────────────────────────────────────────────
function saveCache(shows,songs){try{localStorage.setItem("sdwf_shows",JSON.stringify(shows));localStorage.setItem("sdwf_songs",JSON.stringify(songs));localStorage.setItem("sdwf_sync",new Date().toISOString());}catch(_){}}
function loadCache(){try{return{shows:JSON.parse(localStorage.getItem("sdwf_shows")||"null"),songs:JSON.parse(localStorage.getItem("sdwf_songs")||"null"),ts:localStorage.getItem("sdwf_sync")};}catch(_){return{};}}

// ── Sync ──────────────────────────────────────────────────────────────────────
async function doSync() {
  S.syncing=true; S.syncMsg="Connecting to Firestore…"; render();
  try {
    const [sd,wd] = await Promise.all([fsAll("shows"),fsAll("songs")]);
    S.shows = sd.map(parse).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    S.songs = {}; wd.map(parse).forEach(s=>{S.songs[String(s.id)]=s;});
    S.lastSync = new Date();
    S.syncMsg = "✓ "+S.shows.length+" shows · "+wd.length+" songs loaded";
    saveCache(S.shows,S.songs);
  } catch(e) { S.syncMsg="✗ "+e.message+" — using cached data"; }
  S.syncing=false; render();
}

// ── Chart parsing ─────────────────────────────────────────────────────────────
// Returns [{label, lines:[{tokens:[{chord,text}]}]}]
function parseSections(chart) {
  const rawLines = (chart||"").split("\n");
  const sections = [];
  let cur = null;

  rawLines.forEach(raw => {
    const line = raw.trimEnd();
    // Section header: [CAPS TEXT] possibly followed by annotation
    // Not a chord if content has a space OR is 5+ all-caps chars
    const hm = line.match(/^\[([^\]]+)\](.*)/);
    if (hm) {
      const inner = hm[1];
      const isChord = /^[A-G][#b]?[a-zA-Z0-9]*$/.test(inner); // e.g. G, Am, D7, F#m
      if (!isChord) {
        cur = { label: inner, annotation: hm[2].trim(), lines: [] };
        sections.push(cur);
        return;
      }
    }
    if (!cur) { cur = { label: "", annotation: "", lines: [] }; sections.push(cur); }
    // Parse inline chords: split on [chord] tokens
    const tokens = [];
    let rest = line;
    const re = /\[([A-G][#b]?[a-zA-Z0-9/]*)\]/g;
    let lastEnd = 0, m;
    while ((m = re.exec(line)) !== null) {
      // text before this chord
      const before = line.slice(lastEnd, m.index);
      if (before) tokens.push({ chord: "", text: before });
      // peek at text after chord (until next chord or end)
      tokens.push({ chord: m[1], text: "" });
      lastEnd = m.index + m[0].length;
    }
    const after = line.slice(lastEnd);
    if (after) tokens.push({ chord: "", text: after });
    // Merge: each chord token takes the text immediately following it
    const merged = [];
    for (let i = 0; i < tokens.length; i++) {
      if (tokens[i].chord) {
        const txt = (tokens[i+1] && !tokens[i+1].chord) ? tokens[i+1].text : "";
        merged.push({ chord: tokens[i].chord, text: txt });
        if (tokens[i+1] && !tokens[i+1].chord) i++;
      } else {
        merged.push({ chord: "", text: tokens[i].text });
      }
    }
    if (merged.length === 0) merged.push({ chord: "", text: "" });
    cur.lines.push({ tokens: merged });
  });

  // Always drop pre-section content (label == "") — key/BPM/note are shown separately
  if (sections.length > 0 && sections[0].label === "") sections.shift();
  return sections.length ? sections : [{ label: "SONG", annotation: "", lines: [] }];
}

function buildSetlist() {
  S.setlist = (S.show&&S.show.songIds||[]).map(id=>S.songs[String(id)]).filter(Boolean);
}
function buildSections() {
  const song = S.setlist[S.songSel];
  S.sections = song ? parseSections(song.chart) : [];
  S.secSel = 0;
}

// ── Long-press detection ──────────────────────────────────────────────────────
let pressStart = {}, pressTimer = {};
function onKeyDown(e) {
  const k = e.key;
  if (pressStart[k]) return; // already tracking
  pressStart[k] = Date.now();
  pressTimer[k] = setTimeout(() => { handleLongPress(k); pressStart[k]=0; }, LONG_MS);
  // also handle as short press immediately for menu navigation
  if (!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Enter"," "].includes(k)) {
    handleShortPress(k);
  }
}
function onKeyUp(e) {
  const k = e.key;
  if (!pressStart[k]) return;
  clearTimeout(pressTimer[k]);
  const elapsed = Date.now() - pressStart[k];
  pressStart[k] = 0;
  if (elapsed < LONG_MS) handleShortPress(k);
}
function handleLongPress(k) {
  const sel = k === "Enter" || k === " ";
  const nxt = k === "ArrowRight" || k === "ArrowDown";
  const bck = k === "ArrowLeft"  || k === "ArrowUp";
  // Long press SELECT → main menu from anywhere, reset selection to top
  if (sel) { S.screen="menu"; S.menuSel=0; render(); return; }
  if (S.screen === "live") {
    if (bck) { S.secSel=0; render(); }                                  // top of song
    if (nxt) { if (S.songSel < S.setlist.length-1){S.songSel++;buildSections();} render(); } // skip song
  } else if (S.screen === "setlist") {
    if (bck) { S.screen="shows"; render(); }                            // back to shows
  }
}
function handleShortPress(k) {
  const dn = k==="ArrowDown" || k==="ArrowRight";
  const up = k==="ArrowUp"   || k==="ArrowLeft";
  const ok = k==="Enter"     || k===" ";
  const bk = k==="Escape";
  const sc = S.screen;

  if (sc==="menu") {
    if (dn) { S.menuSel=(S.menuSel+1)%MENU.length; render(); }
    else if (up) { S.menuSel=(S.menuSel-1+MENU.length)%MENU.length; render(); }
    else if (ok) {
      const a=S.menuSel;
      if (a===0) { S.screen="shows"; S.showSel=0; render(); }
      else if (a===1) { if (!S.show){S.screen="shows";S.showSel=0;}else{buildSetlist();buildSections();S.screen="live";} render(); }
      else if (a===2) { if (!S.show){S.screen="shows";S.showSel=0;}else{buildSetlist();buildSections();S.songSel=0;S.screen="options";} render(); }
      else if (a===3) { S.screen="sync"; doSync(); }
      else if (a===4) { S.screen="foot"; render(); }
    }
  } else if (sc==="shows") {
    if (!S.shows.length) return;
    if (dn) { S.showSel=(S.showSel+1)%S.shows.length; render(); }
    else if (up) { S.showSel=(S.showSel-1+S.shows.length)%S.shows.length; render(); }
    else if (ok) { S.show=S.shows[S.showSel]; buildSetlist(); S.songSel=0; S.screen="setlist"; render(); }
    else if (bk) { S.screen="menu"; render(); }
  } else if (sc==="setlist") {
    if (!S.setlist.length) return;
    if (dn) { S.songSel=(S.songSel+1)%S.setlist.length; render(); }
    else if (up) { S.songSel=(S.songSel-1+S.setlist.length)%S.setlist.length; render(); }
    else if (ok) { buildSections(); S.screen="live"; render(); }
    else if (bk) { S.screen="shows"; render(); }
  } else if (sc==="live") {
    if (dn) {
      if (S.secSel < S.sections.length-1) { S.secSel++; render(); }
      else if (S.songSel < S.setlist.length-1) { S.songSel++; buildSections(); render(); }
    } else if (up) {
      if (S.secSel > 0) { S.secSel--; render(); }
      else if (S.songSel > 0) { S.songSel--; buildSections(); S.secSel=S.sections.length-1; render(); }
    } else if (ok || bk) { S.screen="setlist"; render(); }
  } else if (sc==="options") {
    if (dn) { S.songSel=(S.songSel+1)%S.setlist.length; render(); }
    else if (up) { S.songSel=(S.songSel-1+S.setlist.length)%S.setlist.length; render(); }
    else if (bk) { S.screen="menu"; render(); }
  } else if (sc==="sync") {
    if (!S.syncing && ok) doSync();
    else if (bk) { S.screen="menu"; render(); }
  } else if (sc==="foot") {
    if (ok||bk) { S.screen="menu"; render(); }
  }
}

document.addEventListener("keydown", onKeyDown);
document.addEventListener("keyup",   onKeyUp);

// ── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag,cls,...kids) {
  const d=document.createElement(tag);
  if (cls) d.className=cls;
  kids.forEach(k=>{if(k==null)return;typeof k==="string"?d.appendChild(document.createTextNode(k)):d.appendChild(k);});
  return d;
}
function hd(title,right) {
  const b=el("div","hd",title); b.appendChild(el("span","hd-r",right||"")); return b;
}
function ft(l,c,r) {
  const f=el("div","ft");
  [["< "+l,""],["SELECT",c?c:"hi"],[""+r+" >",""]].forEach(([t,cls],i)=>{
    const cell=el("div","ft-cell"+(i===1?" hi":""),t); f.appendChild(cell);
  });
  return f;
}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(_){return d;}}

// ── Screens ───────────────────────────────────────────────────────────────────
function renderMenu() {
  const app=document.getElementById("app");
  app.appendChild(hd("MAIN MENU",VER));
  const sc=el("div","scroll");
  MENU.forEach((label,i)=>{
    const r=el("div","row "+(i===S.menuSel?"sel":"dim")); r.appendChild(el("span","n",(i+1)+")"));r.appendChild(el("span","lbl",label));sc.appendChild(r);});
  app.appendChild(sc);
  const f=el("div","ft");
  const h=el("div","hint","FOOT: NEXT / BACK move, SELECT enters.   KEYS: ↑ ↓ → | 0 = main menu");
  app.appendChild(h);
}

function renderShows() {
  const app=document.getElementById("app");
  app.appendChild(hd("SELECT SHOW",S.shows.length+" shows"));
  const sc=el("div","scroll");
  if (!S.shows.length) sc.appendChild(el("div","hint","No shows — go to Storage | Sync."));
  S.shows.forEach((show,i)=>{
    const r=el("div","row "+(i===S.showSel?"sel":"dim"));
    r.appendChild(el("span","n",(i+1)+")"));r.appendChild(el("span","lbl",show.name||"Untitled"));
    if (show.date) r.appendChild(el("span","r",fmtDate(show.date)));
    sc.appendChild(r);
  });
  app.appendChild(sc);
  app.appendChild(ft("BACK","LOAD","NEXT"));
}

function renderSetlist() {
  const app=document.getElementById("app");
  app.appendChild(hd((S.show&&S.show.name||"SET LIST").toUpperCase(),S.setlist.length+" SONGS"));
  const sc=el("div","scroll");
  S.setlist.forEach((song,i)=>{
    const r=el("div","row "+(i===S.songSel?"sel":"dim"));
    r.appendChild(el("span","n",(i+1)+")"));r.appendChild(el("span","lbl",song.title));
    if (song.key) r.appendChild(el("span","r",song.key));
    sc.appendChild(r);
  });
  app.appendChild(sc);
  app.appendChild(ft("BACK","LOAD","NEXT"));
}

function renderLive() {
  const app=document.getElementById("app");
  const song=S.setlist[S.songSel];
  if (!song||!S.sections.length){S.screen="setlist";renderSetlist();return;}
  const sec=S.sections[S.secSel];
  const next=S.sections[S.secSel+1]||(S.songSel<S.setlist.length-1?{label:"NEXT SONG: "+(S.setlist[S.songSel+1]||{}).title,lines:[]}:null);

  // Header: song title + position label
  const totalSec=S.sections.length;
  const posLabel=(S.secSel+1)+" / "+totalSec;
  app.appendChild(hd(song.title.toUpperCase(),posLabel));

  // Meta strip
  const ms=el("div","meta-strip");
  const key=song.key||"—"; const capo=song.capo||0; const bpm=song.bpm||"—";
  ms.innerHTML="<span>KEY: <b>"+key+"</b></span><span>CAPO: <b>"+(capo||"0")+"</b></span><span>BPM: <b>"+bpm+"</b></span>";
  app.appendChild(ms);

  // Note (if present — shown once, above first section)
  if (S.secSel===0 && song.note) {
    const n=el("div","",song.note); n.style.cssText="padding:12px 28px;font:400 26px/1.4 var(--font);color:oklch(0.72 0.16 150);";
    app.appendChild(n);
  }

  // Live body
  const body=el("div","live-body");

  // Section banner — annotation already has its own parens from the chart
  const label=sec.label+(sec.annotation?"  "+sec.annotation:"");
  body.appendChild(el("div","section-banner","["+label+"]"));

  // Lines
  const linesDiv=el("div","lines");
  sec.lines.forEach(line=>{
    const ld=el("div","line");
    line.tokens.forEach(tok=>{
      const td=el("div","token");
      if (tok.chord) { td.appendChild(el("span","ch",tok.chord)); } else { td.appendChild(el("span","spc")); }
      td.appendChild(el("span","wd",tok.text||(tok.chord?" ":"")));
      ld.appendChild(td);
    });
    linesDiv.appendChild(ld);
  });
  body.appendChild(linesDiv);

  // Next section preview
  if (next) {
    const np=el("div","next-preview");
    np.appendChild(el("div","next-banner","NEXT: ["+next.label+"]"));
    (next.lines||[]).slice(0,2).forEach(line=>{
      const ld=el("div","next-line");
      line.tokens.forEach(tok=>{
        const td=el("div","next-token"); td.appendChild(el("span","wd",tok.text||"")); ld.appendChild(td);
      });
      np.appendChild(ld);
    });
    body.appendChild(np);
  }

  app.appendChild(body);
  app.appendChild(ft("BACK","SELECT","NEXT"));
}

function renderOptions() {
  const app=document.getElementById("app");
  app.appendChild(hd("SONG OPTIONS",(S.show&&S.show.name||"").toUpperCase()));
  app.appendChild(el("div","hint","NEXT / BACK scroll. Song key, capo, BPM."));
  const sc=el("div","scroll");
  S.setlist.forEach((song,i)=>{
    const r=el("div","row "+(i===S.songSel?"sel":"dim"));
    r.appendChild(el("span","n",(i+1)+")"));r.appendChild(el("span","lbl",song.title));
    const meta=[song.key?"Key "+song.key:"—",song.bpm?song.bpm+" BPM":"",song.capo?"Capo "+song.capo:""].filter(Boolean).join("  ·  ");
    r.appendChild(el("span","r",meta));
    sc.appendChild(r);
  });
  app.appendChild(sc);
  app.appendChild(ft("BACK","","NEXT"));
}

function renderSync() {
  const app=document.getElementById("app");
  app.appendChild(hd("STORAGE | SYNC",""));
  const cache=loadCache();
  const ts=S.lastSync?S.lastSync.toLocaleString():(cache.ts?new Date(cache.ts).toLocaleString():"Never");
  const blk=el("div","info-block");
  blk.innerHTML="<div>LAST SYNC: <b>"+ts+"</b></div>";
  if (S.syncing) {
    blk.innerHTML+="<div>⟳ Syncing…</div>";
  } else if (S.syncMsg) {
    const ok=S.syncMsg[0]==="✓";
    blk.innerHTML+="<div class='"+(ok?"green":"red")+"'>"+S.syncMsg+"</div>";
  }
  app.appendChild(blk);
  if (!S.syncing) {
    const b=el("div","btn primary","SYNC NOW"); b.onclick=()=>doSync();
    app.appendChild(b);
  }
  app.appendChild(el("div","hint","ENTER = sync now   ESC = main menu   0 = main menu"));
}

function renderFoot() {
  const app=document.getElementById("app");
  app.appendChild(hd("FOOT SWITCH","3 × GPIO"));
  app.appendChild(el("div","hint","SELECT cycles the action for the highlighted switch.\nGPIO 17 / 27 / 22 to ground, internal pull-up, 25 ms debounce."));
  const sc=el("div","scroll");
  [["BACK","previous section"],["SELECT","set list / menu"],["NEXT","next section"]].forEach(([label,val])=>{
    const r=el("div","row dim"); r.appendChild(el("span","n","")); r.appendChild(el("span","lbl",label)); r.appendChild(el("span","r",val)); sc.appendChild(r);
  });
  const blk=el("div","info-block"); blk.innerHTML="<div class='green'>LONG PRESS (&gt; 700 ms)</div><div>BACK → top of song</div><div>SELECT → main menu</div><div>NEXT → skip to next song</div>";
  app.appendChild(sc); app.appendChild(blk);
  app.appendChild(ft("BACK","CHANGE","NEXT"));
}

function render() {
  const app=document.getElementById("app"); app.innerHTML="";
  const sc=S.screen;
  if      (sc==="menu")    renderMenu();
  else if (sc==="shows")   renderShows();
  else if (sc==="setlist") renderSetlist();
  else if (sc==="live")    renderLive();
  else if (sc==="options") renderOptions();
  else if (sc==="sync")    renderSync();
  else if (sc==="foot")    renderFoot();
  const sel=app.querySelector(".sel,.section-banner");
  if (sel) sel.scrollIntoView({block:"nearest"});
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async function boot() {
  const c=loadCache();
  if (c.shows&&c.songs){S.shows=c.shows;S.songs=c.songs;S.lastSync=c.ts?new Date(c.ts):null;}
  render();
  try { await doSync(); } catch(_) {}
  if (S.screen==="menu"||S.screen==="sync") render();
})();
</script>
</body>
</html>
